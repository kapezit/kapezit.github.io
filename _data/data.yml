career-profile:
    title: Career Profile
    summary: |
      My primary responsibility as a Gameplay Telemetry Researcher is to provide 
      actionable insights derived from gameplay telemetry. Achieving this 
      objective necessitates my expertise in leading and supporting efforts in telemetry design, 
      data quality assurance, and acting as a liaison between the User 
      Research and Data Analysts teams. I take pride in contributing to the 
      improvement and expansion of the user research team's toolkit.

experiences:
    title: Experiences
    info:

      - role: Data Analyst
        time: 2026 - 6 month contract
        company: 2K Games, Novato
        details: |
          Analyzed live Borderlands 4 and DLC gameplay data to identify friction points and track engagement and retention KPIs, delivering insights to developers, community, production, and leadership that shaped feature and system improvements.
          
      
      - role: Senior Gameplay Telemetry Researcher
        time: 2025 - 6 months
        company: 2K Games, Novato
        details: |
          Serving as a pivotal bridge between the Data Insights and User Research teams at 2K. My role enables the integration of telemetry in game user research with a focus on the Gearbox portfolio. 
          The primary responsibility is to deliver actionable insights derived from gameplay telemetry. This requires leveraging my expertise in user research, along with supporting efforts in telemetry design and data quality.
    
      - role: User Research Analyst
        time: 2025 - 5 months
        company: 2K Games, Novato (5 months of role transition from Gearbox to 2K)
        details: |
          Following Gearbox's acquisition by Take-Two Interactive, my role transitioned to 2K, where I continued driving cross-functional initiatives with a focus on gameplay telemetry integration in user research, data analysis, and actionable insights.
            
      - role: User Research Analyst
        time: 2022 to 2024 - 2 years and 4 months
        company: Gearbox, Frisco
        details: |
          Worked in collaboration with project developers and User Research Investigators by analyzing telemetry data collected on titles from across the Gearbox portfolio. 
          Advocated for gameplay data collection and analysis best practices as well as helping to improve the Analysis Team’s capabilities. Tools:
            - SQL
            - Data sources: Snowflake, Databricks
            - Tableau
            - Excel / Google Sheets
            
      - role: Freelance Data Analyst for various Esports orgs
        time: 2020 - 2022
        company: Finezt Gaming and Rocket Street
        details: |
          Data analysis of player statistics for tournament decision-making, community share-outs and bracket management.
          Product: Finezt sponsored tournaments and Rocket Street (Psyonix) sponsored tournaments.
            - Web-scraping using Python
            - Analysis in Excel, Google Sheets, and Tableau

      - role: User Researcher
        time: 2017-2019
        company: Meta (Facebook)
        details: |
          The main responsibility was to represent the voice of the advertiser to internal teams by conducting research for the Ads Manager and Reporting team.
          This involved planning, recruitment, conducting research, analysis, and reporting. Frequently used methods: remote interviews, surveys, usability tests, and card sorting.

      - role: User Research Assistant - Contract
        time: 2016-2016
        company: Anki
        details: |
            Mainly involved with the setup of the tests, recordings, and analysis of videos as well as intake and outtake of participants. Product: Cozmo (interactive robot)

      - role: Jr. User Research Assistant - Contract
        time: 2015-2015
        company: Activision
        details: |
          Assisted with the execution of game progression testing and playtesting under the direction of a supervisor. Responsibilities included recruitment, lab setup, 
          intake/outtake of participants, recording/reporting of playtests. Product: Guitar Hero Live, Skylanders: Superchargers, and Call of Duty: Black Ops III.


